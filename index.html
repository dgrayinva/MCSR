<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Radio Recycler</title>
  <style>
    :root {
      --bg: #111113; --surface: #1c1c21; --surface-hi: #24242b;
      --accent: #ff5500; --accent-hover: #e04b00;
      --text: #f4f4f6; --muted: #9a9aa6; --border: #2c2c35;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg); color: var(--text);
      margin: 0; padding: 20px; display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 680px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 18px; flex-wrap: wrap; gap: 10px;
    }
    h1 { font-size: 1.35rem; margin: 0; letter-spacing: -0.02em; }
    .badge {
      font-size: 0.8rem; color: var(--muted); background: var(--surface);
      padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
    }
    .spotlight {
      background: var(--surface); border: 1px solid var(--accent);
      border-radius: 14px; padding: 20px; margin-bottom: 24px;
    }
    .spotlight-tag {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--accent); margin-bottom: 6px;
    }
    .spotlight-title { font-size: 1.3rem; font-weight: 700; margin: 0 0 6px 0; }
    .spotlight-sub { font-size: 0.88rem; color: var(--muted); margin: 0 0 16px 0; }
    .spotlight-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button, a.btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: var(--accent); color: white; border: none; padding: 12px 18px;
      border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.95rem;
      text-decoration: none;
    }
    button:hover, a.btn:hover { background: var(--accent-hover); }
    button.done { background: #15803d; }
    button.done:hover { background: #166534; }
    button.secondary { background: var(--surface-hi); color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: #2e2e37; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .show-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
    .show-item {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--border); gap: 10px;
    }
    .show-item.active { border-color: var(--accent); background: #221b18; }
    .show-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
    .show-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .show-actions { display: flex; gap: 6px; }
    .btn-small { padding: 6px 11px; font-size: 0.82rem; border-radius: 7px; }
    .add-form { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type="text"] {
      flex: 1; min-width: 180px; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 11px 12px; border-radius: 8px; font-size: 0.9rem;
    }
    input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; cursor: pointer; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>House Radio Recycler</h1>
    <div class="badge" id="cycleStatus">0 / 6 heard this cycle</div>
  </header>
  <div class="spotlight" id="spotlightBox"></div>
  <div class="section-header">
    <div class="section-title">Your Radio Pool (Uncheck to Mute)</div>
    <button class="secondary btn-small" id="resetBtn">Reset Defaults</button>
  </div>
  <div class="show-list" id="showList"></div>
  <div class="section-title" style="margin-bottom: 10px;">Add Another Show URL (Paste SoundCloud Share Link)</div>
  <div class="add-form">
    <input type="text" id="newName" placeholder="Show Name">
    <input type="text" id="newUrl" placeholder="https://soundcloud.com...">
    <button id="addBtn">Add</button>
  </div>
</div>
<script>
  const DEFAULT_SHOWS = [
    { id: "blacklegend", name: "Black Legend — The Legendary Radio Show", slug: "blacklegendproject/tracks", enabled: true, lastNote: "" },
    { id: "defected", name: "Defected Records — Defected Radio Show", slug: "defectedrecords/sets/defected-in-the-house-radio", enabled: true, lastNote: "" },
    { id: "motive", name: "Motive Records — Motive Radio Show", slug: "motiverecordsau/sets/motive-radio", enabled: true, lastNote: "" },
    { id: "ndyd", name: "Ricardo Torres — The NDYD Radio Show", slug: "ndyd-rs/tracks", enabled: true, lastNote: "" },
    { id: "wh0", name: "Wh0 Plays Sessions", slug: "wh0playssessions/tracks", enabled: true, lastNote: "" },
    { id: "housebound", name: "HouseBound Radio Show", slug: "wilson-frisk/tracks", enabled: true, lastNote: "" }
  ];

  function getShowUrl(show) {
    if (state.pinnedEpisodeUrl) return state.pinnedEpisodeUrl;
    if (show.url && show.url.length > 24) return show.url;
    return ["https:", "", "soundcloud.com", show.slug].join("/");
  }

  let shows = JSON.parse(localStorage.getItem("sc_recycler_v5_shows")) || JSON.parse(JSON.stringify(DEFAULT_SHOWS));
  let state = JSON.parse(localStorage.getItem("sc_recycler_v5_state")) || {
    activeShowId: null, inProgress: false, cycleCompletedIds: [], everHeardIds: [], pinnedEpisodeUrl: ""
  };

  function saveAll() {
    localStorage.setItem("sc_recycler_v5_shows", JSON.stringify(shows));
    localStorage.setItem("sc_recycler_v5_state", JSON.stringify(state));
  }

  function pickRandomShow(excludeId = null) {
    const enabled = shows.filter(s => s.enabled);
    if (!enabled.length) {
      state.activeShowId = null; state.inProgress = false; state.pinnedEpisodeUrl = "";
      saveAll(); render(); return;
    }
    let pool = enabled.filter(s => !state.cycleCompletedIds.includes(s.id) && s.id !== excludeId);
    if (!pool.length) {
      state.cycleCompletedIds = [];
      pool = enabled.filter(s => s.id !== excludeId);
      if (!pool.length) pool = enabled;
    }
    const chosen = pool[Math.floor(Math.random() * pool.length)];
    state.activeShowId = chosen.id;
    state.inProgress = false;
    state.pinnedEpisodeUrl = "";
    saveAll(); render();
  }

  function render() {
    const enabled = shows.filter(s => s.enabled);
    const doneCount = enabled.filter(s => state.cycleCompletedIds.includes(s.id)).length;
    document.getElementById("cycleStatus").textContent = `${doneCount} / ${enabled.length} heard this cycle`;

    let activeShow = shows.find(s => s.id === state.activeShowId && s.enabled);
    if (!activeShow && enabled.length) { pickRandomShow(); return; }

    const spot = document.getElementById("spotlightBox");
    if (!activeShow) {
      spot.innerHTML = `<div class="spotlight-tag">PAUSED</div><h2 class="spotlight-title">No shows enabled</h2><p class="spotlight-sub">Check at least one show below.</p>`;
    } else {
      const targetUrl = getShowUrl(activeShow);
      const hasPinned = Boolean(state.pinnedEpisodeUrl);
      const tag = state.inProgress
        ? (hasPinned ? "IN PROGRESS — PINNED EPISODE SAVED" : "IN PROGRESS — PICK UP WHERE YOU LEFT OFF")
        : "UP NEXT IN ROTATION";
      const sub = activeShow.lastNote
        ? `Previously heard: ${activeShow.lastNote}`
        : (hasPinned ? "Locked to your exact episode link until you mark Finished." : "Opens directly to the show's radio playlist or newest tracks.");
      const btnText = hasPinned
        ? "▶ Resume Exact Episode"
        : (state.inProgress ? "▶ Continue in SoundCloud" : "▶ Open Show Feed");

      spot.innerHTML = `
        <div class="spotlight-tag">${tag}</div>
        <h2 class="spotlight-title">${activeShow.name}</h2>
        <p class="spotlight-sub">${sub}</p>
        <div class="spotlight-actions" style="margin-bottom: 14px;">
          <a class="btn" id="launchBtn" href="${targetUrl}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">${btnText}</a>
          <button class="done" id="finishBtn">✓ Finished — Next Show</button>
          <button class="secondary" id="rerollBtn">↻ Skip / Reroll</button>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--border); padding-top:12px;">
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <input type="text" id="noteInput" value="" placeholder="Add episode # or date (e.g., Ep 443) — appends to Heard list on Finished" style="font-size:0.82rem; padding:8px 10px;">
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <input type="text" id="pinInput" value="${state.pinnedEpisodeUrl || ""}" placeholder="Optional: Paste exact episode Share link here to pin it" style="font-size:0.82rem; padding:8px 10px;">
            <button class="secondary btn-small" id="pinSaveBtn">${hasPinned ? "Update Link" : "Pin Episode"}</button>
            ${hasPinned ? `<button class="secondary btn-small" id="pinClearBtn">Clear</button>` : ""}
          </div>
        </div>
      `;

      document.getElementById("launchBtn").onclick = () => {
        state.inProgress = true; saveAll();
        setTimeout(render, 200);
      };
      document.getElementById("finishBtn").onclick = () => {
        const noteVal = document.getElementById("noteInput").value.trim();
        const showIdx = shows.findIndex(s => s.id === activeShow.id);
        if (showIdx !== -1 && noteVal) {
          const prev = shows[showIdx].lastNote || "";
          shows[showIdx].lastNote = prev ? `${prev}, ${noteVal}` : noteVal;
        }

        if (!state.cycleCompletedIds.includes(activeShow.id)) state.cycleCompletedIds.push(activeShow.id);
        if (!state.everHeardIds.includes(activeShow.id)) state.everHeardIds.push(activeShow.id);
        pickRandomShow(activeShow.id);
      };
      document.getElementById("rerollBtn").onclick = () => pickRandomShow(activeShow.id);

      document.getElementById("pinSaveBtn").onclick = () => {
        const val = document.getElementById("pinInput").value.trim();
        if (!val) return;
        state.pinnedEpisodeUrl = val;
        state.inProgress = true;
        saveAll(); render();
      };
      if (hasPinned) {
        document.getElementById("pinClearBtn").onclick = () => {
          state.pinnedEpisodeUrl = "";
          saveAll(); render();
        };
      }
    }

    const listEl = document.getElementById("showList");
    listEl.innerHTML = "";
    shows.forEach((show, idx) => {
      const isCurrent = show.id === state.activeShowId;
      const isEverDone = state.everHeardIds.includes(show.id);
      const item = document.createElement("div");
      item.className = "show-item" + (isCurrent ? " active" : "");

      const info = document.createElement("div");
      info.className = "show-info";
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = show.enabled;
      cb.onchange = () => {
        shows[idx].enabled = cb.checked; saveAll();
        if (!cb.checked && isCurrent) pickRandomShow(show.id); else render();
      };

      const textWrap = document.createElement("div");
      textWrap.style.minWidth = "0";
      textWrap.style.flex = "1";

      const lbl = document.createElement("div");
      lbl.className = "show-name";
      lbl.innerHTML = (isEverDone ? `<span style="color:#22c55e;font-weight:700;">✓</span> ` : "") + show.name;
      textWrap.appendChild(lbl);

      if (show.lastNote) {
        const subNote = document.createElement("div");
        subNote.style.fontSize = "0.78rem";
        subNote.style.color = "var(--muted)";
        subNote.style.wordBreak = "break-word";
        subNote.textContent = `Heard: ${show.lastNote}`;
        textWrap.appendChild(subNote);
      }

      info.append(cb, textWrap);

      const actions = document.createElement("div");
      actions.className = "show-actions";
      const sel = document.createElement("button");
      sel.className = "secondary btn-small"; sel.textContent = "Select";
      sel.onclick = () => {
        state.activeShowId = show.id; state.inProgress = false; state.pinnedEpisodeUrl = "";
        saveAll(); render();
      };
      const del = document.createElement("button");
      del.className = "secondary btn-small"; del.textContent = "✕";
      del.onclick = () => {
        const rid = show.id; shows.splice(idx, 1); saveAll();
        if (rid === state.activeShowId) pickRandomShow(); else render();
      };
      actions.append(sel, del);
      item.append(info, actions);
      listEl.appendChild(item);
    });
  }

  document.getElementById("addBtn").onclick = () => {
    const name = document.getElementById("newName").value.trim();
    const rawUrl = document.getElementById("newUrl").value.trim();
    if (!name || !rawUrl) return;
    const slug = rawUrl.replace(/^https?:\/\/(www\.|m\.)?soundcloud\.com\//i, "").split("?").replace(/^\/+|\/+$/g, "");
    shows.push({ id: "custom_" + Date.now(), name, slug, url: rawUrl, enabled: true, lastNote: "" });
    saveAll(); render();
    document.getElementById("newName").value = "";
    document.getElementById("newUrl").value = "";
  };

  document.getElementById("resetBtn").onclick = () => {
    shows = JSON.parse(JSON.stringify(DEFAULT_SHOWS));
    state = { activeShowId: null, inProgress: false, cycleCompletedIds: [], everHeardIds: [], pinnedEpisodeUrl: "" };
    saveAll(); pickRandomShow();
  };

  if (!state.activeShowId) pickRandomShow(); else render();
</script>
</body>
</html>
